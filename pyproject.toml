[project]
name = "fraudshield"
version = "0.1.0"
description = "Real-time card-fraud detection with a full MLOps loop"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "duckdb>=1.0",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "shap>=0.46",
  "mlflow>=3.0",
  "matplotlib>=3.9",
  "redis>=5.0",
  "confluent-kafka>=2.5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "prometheus-client>=0.20",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Added when the matching phase starts (keeps installs light early on)
monitoring = ["evidently>=0.6", "prefect>=3.0"]
notebooks = ["jupyterlab>=4", "seaborn>=0.13"]

[dependency-groups]
dev = ["pytest>=8", "fakeredis>=2.23", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fraudshield"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
